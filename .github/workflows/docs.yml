name: Docs

# The site (the Sphinx guides and references at the root, the Doxygen API reference under api/), built and published
# to GitHub Pages on every push to the default branch. Ubuntu 24.04's Doxygen (1.9.8), every warning fatal (the
# Doxyfile's WARN_AS_ERROR): a newer one resolved references 1.9.8 refused, so the runner is named, not
# `ubuntu-latest`. The Python reference imports the built extension, so the job builds it.
on:
  push:
    branches: [main]
    paths: ['include/**', 'python/**', 'README.md', 'BENCHMARKS.md', 'docs/**', 'tools/check_site_*.py', 'Doxyfile',
            'Makefile', '.github/workflows/docs.yml']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an unfinished one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: NumericAL
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.10.7
          path: sciforge
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Install the extension's build backend (the Python reference imports the built module)
        run: python -m pip install setuptools
      - name: The site's gate (every Sphinx warning fatal, every public name listed, every shown example run)
        run: make -C NumericAL docs-site-gate
      - name: Build the site (guides and references, the Doxygen reference under api/)
        run: make -C NumericAL docs-site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: NumericAL/build/site/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
