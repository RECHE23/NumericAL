name: CI

# Actions-minute economy (macOS runners bill 10x): macOS is the maintainer's local
# development platform — every gate runs there via `make full-local-gate` on each
# slice — so CI deliberately omits macOS and covers the *non-local* platforms instead:
# Linux (clang + g++-14), Windows/MSVC and ARM, all on GitHub-hosted runners. Run on
# main only (plus PRs); workflow_dispatch is available for ad-hoc runs. Doc-only
# pushes are skipped.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

jobs:
  # Lint (format + MISRA) via SciForge's reusable spine: pins clang-tidy-18 and runs
  # this repo's make format-check / misra against the shared lint/ config. NumericAL is a leaf — no dependency siblings.
  lint:
    uses: RECHE23/sciforge/.github/workflows/lint-cpp.yml@v2026.10.6
    with:
      deps: '[]'
      sciforge-ref: v2026.10.6
      runner-mode: hosted

  # POSIX + CMake build via SciForge's reusable build spine: the Makefile under
  # g++-14 + clang++ with sanitizers (Linux baseline), and CMake configure/build/
  # test/install + find_package smoke across linux-x64, Windows/MSVC and native ARM
  # — matching NumericAL's prior coverage exactly (macOS is the local gate, off in CI).
  # NumericAL is a leaf (no dependency siblings, so no ci-pat).
  build:
    uses: RECHE23/sciforge/.github/workflows/build-cpp.yml@v2026.10.6
    with:
      deps: '[]'
      sciforge-ref: v2026.10.6
      runner-mode: hosted
      enable-windows-msvc: true
      enable-arm: true

  # The abi3 binding + the zero-copy interop round-trips against NumPy, via SciForge's
  # reusable spine. NumericAL is a leaf (deps='[]'); its exact prior coverage is
  # {linux, Windows} x {3.10, 3.14} (macOS off — the local gate). NumPy is
  # pre-installed for the interop round-trips. The stubs are checked against the runtime (stubtest) before the
  # unit tests, with mypy pinned as SciLex pins it.
  python:
    uses: RECHE23/sciforge/.github/workflows/python-cpp.yml@v2026.10.6
    with:
      python-versions: '["3.10","3.14"]'
      sciforge-ref: v2026.10.6
      deps: '[]'
      test-cmd: 'python -m pip install mypy==2.3.0 && python -m mypy.stubtest numerical && python -m unittest discover -s python/tests'
      runner-mode: hosted
      enable-windows: true
      pre-install: numpy

  # The numerical_blas library the Linux wheel carries, under a real BLAS/LAPACK consumer: Ubuntu's NumPy and SciPy,
  # linked against the system's libblas.so.3 and liblapack.so.3, with numerical.blas_library() in LD_PRELOAD. Its
  # answers are checked, the dynamic linker's bindings show NumPy's calls resolved to it, and it exports the Fortran
  # routines alone, as CMake's -DNUMERICAL_BUILD_BLAS=ON build of it does.
  blas-preload:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.10.6
          path: sciforge
      - name: Install the system's NumPy and SciPy, build the wheel and install it beside them
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-numpy python3-scipy python3-pytest python3-hypothesis python3-venv cmake g++
          # Built in a venv of its own, its build requirements isolated as pip installs them; then installed beside
          # the system's NumPy and SciPy, whose own setuptools and packaging are too old for the build.
          /usr/bin/python3 -m venv /tmp/build
          SCIFORGE_INCLUDE="$PWD/sciforge/include" /tmp/build/bin/pip wheel -q --no-deps -w dist .
          /usr/bin/python3 -m venv --system-site-packages /tmp/venv
          /tmp/venv/bin/pip install -q --no-deps dist/*.whl
          echo "BLAS_LIBRARY=$(cd /tmp && /tmp/venv/bin/python -c 'import numerical; print(numerical.blas_library())')" >> "$GITHUB_ENV"
      - name: The library from Python, and the Fortran routines alone exported
        working-directory: /tmp
        run: |
          /tmp/venv/bin/python -m unittest discover -s "$GITHUB_WORKSPACE/python/tests" -p test_blas_library.py -v
          cmake -S "$GITHUB_WORKSPACE" -B cmake-build -DNUMERICAL_BUILD_BLAS=ON -DSCIFORGE_INCLUDE_DIR="$GITHUB_WORKSPACE/sciforge/include" -DCMAKE_BUILD_TYPE=Release
          cmake --build cmake-build --target numerical_blas -j4
          for library in "$BLAS_LIBRARY" cmake-build/libnumerical_blas.so; do
            symbols=$(nm -D --defined-only "$library" | awk '{print $3}')
            others=$(echo "$symbols" | grep -v -E '^[a-z]+_(64_)?$' || true)
            [ -z "$others" ] || { echo "$library exports more than the Fortran routines:"; echo "$others"; exit 1; }
            [ "$(echo "$symbols" | wc -l)" -eq 78 ] || { echo "$library: $(echo "$symbols" | wc -l) routines, not 78"; exit 1; }
          done
      - name: NumPy's answers with numerical_blas preloaded
        run: LD_PRELOAD="$BLAS_LIBRARY" /tmp/venv/bin/python blas/preload_check.py
      - name: NumPy's calls bound to numerical_blas
        run: |
          LD_PRELOAD="$BLAS_LIBRARY" LD_DEBUG=bindings /tmp/venv/bin/python blas/preload_check.py 2> bindings.txt
          for symbol in dgesv_ dpotrf_ dgemm_ dsyevd_ dgesdd_ dgeqrf_ dorgqr_ dgelsd_ dgeev_ dsyrk_ dgemv_ ddot_ dtrsm_ sgemm_ cgemm_ zgemm_ sgesv_ cgesv_ zgesv_ sgetrf_ cgetrf_ zgetrf_ spotrf_ cpotrf_ zpotrf_; do
            grep -q "to $BLAS_LIBRARY \[0\]: normal symbol \`$symbol'" bindings.txt || { echo "$symbol not bound to numerical_blas"; exit 1; }
          done
      # The reference LAPACK calls the BLAS it is linked with: preloaded, its routines run on numerical_blas's too, and
      # NumPy's and SciPy's own linear algebra suites check both.
      - name: NumPy's and SciPy's linear algebra test suites with numerical_blas preloaded
        working-directory: /tmp
        run: LD_PRELOAD="$BLAS_LIBRARY" /tmp/venv/bin/python -m pytest -q -p no:cacheprovider --pyargs numpy.linalg scipy.linalg

  # A platform without a wheel (free-threaded CPython, ppc64le, s390x, BSD…) builds the
  # sdist: it must hold everything the build reads. Built, installed from source in a
  # clean venv outside the checkout, then tested.
  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Build the sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist
      - name: Install it from source in a clean venv and test it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install numpy
          "$RUNNER_TEMP/venv/bin/pip" install --no-binary numeric-al dist/numeric_al-*.tar.gz
          mkdir "$RUNNER_TEMP/unpacked" && tar -xzf dist/numeric_al-*.tar.gz -C "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s "$RUNNER_TEMP"/unpacked/numeric_al-*/python/tests

  # The Python suite on arm64 Linux, built by GCC as the aarch64 wheels are. GCC fuses a multiply and an add
  # wherever a fused multiply-add exists, across statements: a result held to NumPy's to the bit (linspace)
  # differed there alone, which no x86-64 or Clang leg can see.
  python-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.10.6
          path: sciforge
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the extension with GCC
        run: |
          python -m pip install numpy setuptools wheel
          CC=gcc CXX=g++ SCIFORGE_INCLUDE="$PWD/sciforge/include" python setup.py -q build_ext --inplace --force
      - name: The Python suite against NumPy
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python/tests
