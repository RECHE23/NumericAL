name: CI

# Actions-minute economy (macOS runners bill 10x): macOS is the maintainer's local
# development platform — every gate runs there via `make full-local-gate` on each
# slice — so CI deliberately omits macOS and covers the *non-local* platforms instead:
# Linux (clang + g++-14), Windows/MSVC and ARM, all on GitHub-hosted runners. Run on
# main only (plus PRs); workflow_dispatch is available for ad-hoc runs. Doc-only
# pushes are skipped.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

jobs:
  # Lint (format + MISRA) via SciForge's reusable spine: pins clang-tidy-18 and runs
  # this repo's make format-check / misra against the shared lint/ config. NumericAL is a leaf — no dependency siblings.
  lint:
    uses: RECHE23/sciforge/.github/workflows/lint-cpp.yml@v2026.10.3
    with:
      deps: '[]'
      sciforge-ref: v2026.10.3
      runner-mode: hosted

  # POSIX + CMake build via SciForge's reusable build spine: the Makefile under
  # g++-14 + clang++ with sanitizers (Linux baseline), and CMake configure/build/
  # test/install + find_package smoke across linux-x64, Windows/MSVC and native ARM
  # — matching NumericAL's prior coverage exactly (macOS is the local gate, off in CI).
  # NumericAL is a leaf (no dependency siblings, so no ci-pat).
  build:
    uses: RECHE23/sciforge/.github/workflows/build-cpp.yml@v2026.10.3
    with:
      deps: '[]'
      sciforge-ref: v2026.10.3
      runner-mode: hosted
      enable-windows-msvc: true
      enable-arm: true

  # The abi3 binding + the zero-copy interop round-trips against NumPy, via SciForge's
  # reusable spine. NumericAL is a leaf (deps='[]'); its exact prior coverage is
  # {linux, Windows} x {3.10, 3.14} (macOS off — the local gate). NumPy is
  # pre-installed for the interop round-trips.
  python:
    uses: RECHE23/sciforge/.github/workflows/python-cpp.yml@v2026.10.3
    with:
      python-versions: '["3.10","3.14"]'
      sciforge-ref: v2026.10.3
      deps: '[]'
      runner-mode: hosted
      enable-windows: true
      pre-install: numpy

  # A platform without a wheel (free-threaded CPython, ppc64le, s390x, BSD…) builds the
  # sdist: it must hold everything the build reads. Built, installed from source in a
  # clean venv outside the checkout, then tested.
  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Build the sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist
      - name: Install it from source in a clean venv and test it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install numpy
          "$RUNNER_TEMP/venv/bin/pip" install --no-binary numeric-al dist/numeric_al-*.tar.gz
          mkdir "$RUNNER_TEMP/unpacked" && tar -xzf dist/numeric_al-*.tar.gz -C "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s "$RUNNER_TEMP"/unpacked/numeric_al-*/python/tests

  # The AVX-512 kernels, which no hosted runner is sure to have: the C++ suite and a fuzz campaign under Intel's
  # Software Development Emulator as a Skylake server, which cpuid then reports. The run fails unless the kernel
  # in use is "avx512", so an emulator that stopped emulating cannot pass for one.
  avx512:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
      SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.10.3
          path: sciforge
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Fetch the emulator
        run: |
          curl -sSfL -A 'Mozilla/5.0' -o "$RUNNER_TEMP/sde.tar.xz" "$SDE_URL"
          echo "$SDE_SHA256  $RUNNER_TEMP/sde.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/sde" && tar -xJf "$RUNNER_TEMP/sde.tar.xz" -C "$RUNNER_TEMP/sde" --strip-components=1
      - name: Build the tests and the extension
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCIFORGE_INCLUDE_DIR="$PWD/sciforge/include"
          cmake --build build -j4
          python -m pip install numpy setuptools
          SCIFORGE_INCLUDE="$PWD/sciforge/include" python setup.py -q build_ext --inplace --force
      - name: The C++ suite and a fuzz campaign on the AVX-512 kernels
        env:
          PYTHONPATH: python
        run: |
          sde="$RUNNER_TEMP/sde/sde64 -skx --"
          path=$($sde python -c 'import numerical; print(numerical.gemm_path())')
          test "$path" = avx512 || { echo "::error::the emulated processor runs the $path kernel, not avx512"; exit 1; }
          $sde build/numerical_tests_bin
          $sde python fuzz/linalg.py --cases 60

  # The Python suite on arm64 Linux, built by GCC as the aarch64 wheels are. GCC fuses a multiply and an add
  # wherever a fused multiply-add exists, across statements: a result held to NumPy's to the bit (linspace)
  # differed there alone, which no x86-64 or Clang leg can see.
  python-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.10.3
          path: sciforge
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the extension with GCC
        run: |
          python -m pip install numpy setuptools wheel
          CC=gcc CXX=g++ SCIFORGE_INCLUDE="$PWD/sciforge/include" python setup.py -q build_ext --inplace --force
      - name: The Python suite against NumPy
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python/tests
