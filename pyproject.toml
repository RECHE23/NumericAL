# Python distribution for NumericAL. Built from the repository root so the sdist is
# self-contained: it carries the C++ headers in include/ alongside the binding in
# python/. The C++ library itself is header-only and needs none of this — see the
# Makefile and CMakeLists.txt for the C++ workflows.
[build-system]
requires = ["setuptools>=77", "sciforge-build>=2026.10.3"]
build-backend = "setuptools.build_meta"

[project]
name = "numeric-al"
version = "2026.10.32"
description = "NumericAL — a generic, header-only numerical library: tensors, Einstein summation and dense linear algebra without BLAS"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "René Chenard", email = "rene.chenard.1@ulaval.ca" }]
keywords = ["tensor", "einsum", "linear-algebra", "numerical", "blas", "lapack", "gemm", "eigenvalues", "svd", "dlpack", "array-interface"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/RECHE23/NumericAL"
Issues = "https://github.com/RECHE23/NumericAL/issues"

# The `numerical` package lives under python/; the C++ binding source under
# python/src; the headers it compiles against under include/ (root).
[tool.setuptools]
package-dir = { "" = "python" }
packages = ["numerical"]

[tool.setuptools.package-data]
numerical = ["*.so", "*.pyd", "py.typed", "*.pyi", "lib/*.so"]

# Build one abi3 wheel per platform (cp310 → works on CPython 3.10+).
[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
# NumPy is the oracle of the property, parity and fuzz tests, which skip without it. The log names the product
# kernel the tests ran on (an x86-64 width, the AMX, or portable), which the runner's processor decides.
test-requires = ["numpy"]
test-command = [
  "python -c \"import numerical; print('gemm path:', numerical.gemm_path())\"",
  "python -m unittest discover -s {project}/python/tests",
]

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
